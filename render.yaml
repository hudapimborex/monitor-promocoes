# Blueprint do Render — só o painel web (Render free não tem Background
# Worker; o agendamento da busca diária roda via GitHub Actions, ver
# .github/workflows/daily-search.yml e o README).
#
# Uso: conecte este repo em https://dashboard.render.com/blueprints e o
# Render lê este arquivo automaticamente. Os campos com `sync: false` pedem
# pra você preencher o valor manualmente no painel do Render (segredos não
# ficam no git).
services:
  - type: web
    name: promo-monitor-web
    runtime: python
    plan: free
    rootDir: backend
    # Migração + seed rodam a cada deploy — são idempotentes (não duplicam
    # nada se já tiverem rodado antes), então é seguro deixar aqui.
    buildCommand: pip install -r requirements.txt && alembic upgrade head && python scripts/bootstrap.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Sem isso, o Render usa a versão mais nova do Python disponível (hoje
      # 3.14), que ainda não tem wheels pré-compiladas pra algumas libs
      # (ex: pydantic-core) — trava o build. Fixamos na mesma versão usada
      # em dev (3.12).
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DATABASE_URL
        sync: false # connection string do Supabase (Postgres) — ver README
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: FIRECRAWL_MONTHLY_CREDIT_BUDGET
        value: "900"
      - key: FIRECRAWL_SCRAPE_TOP_N
        value: "3"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_DEFAULT_CHAT_ID
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE_MINUTES
        value: "10080"
      - key: PRICE_DROP_THRESHOLD_PCT
        value: "15"
      - key: PRICE_BASELINE_WINDOW_DAYS
        value: "60"
      - key: PRICE_MIN_STABLE_DAYS
        value: "3"
      - key: BOOTSTRAP_USER_EMAIL
        sync: false
      - key: BOOTSTRAP_USER_PASSWORD
        sync: false
