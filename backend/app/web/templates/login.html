<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Monitor de Promoções</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115; --card: #171a21; --text: #e8e8e8; --muted: #9aa0a6;
      --accent: #4fd1c5; --danger: #f56565; --border: #2a2e37;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f7f7f8; --card: #ffffff; --text: #1a1a1a; --muted: #666; --border: #e2e2e2; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    form {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 32px; width: 100%; max-width: 360px;
    }
    h1 { font-size: 20px; margin: 0 0 20px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%; padding: 10px 12px; margin-bottom: 16px; border-radius: 6px;
      border: 1px solid var(--border); background: transparent; color: var(--text); font-size: 14px;
    }
    button {
      width: 100%; padding: 10px; border: none; border-radius: 6px;
      background: var(--accent); color: #06231f; font-weight: 600; cursor: pointer; font-size: 14px;
    }
    .error { color: var(--danger); font-size: 13px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1>Monitor de Promoções</h1>
    {% if error %}<p class="error">E-mail ou senha inválidos.</p>{% endif %}
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" required autofocus>
    <label for="password">Senha</label>
    <input type="password" id="password" name="password" required>
    <button type="submit">Entrar</button>
  </form>
</body>
</html>
