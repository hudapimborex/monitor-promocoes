# Roda a busca diária de promoções — substitui o "Background Worker" que o
# Render não oferece de graça (ver README). Totalmente gratuito dentro dos
# limites do GitHub Actions (2.000 min/mês em repo privado, ilimitado em
# repo público) — um run diário deste job leva poucos minutos.
name: Busca diária de promoções

on:
  schedule:
    # 07:00 horário de Brasília = 10:00 UTC (Brasil não tem mais horário de
    # verão desde 2019, então não precisa ajustar ao longo do ano).
    - cron: "0 10 * * *"
  workflow_dispatch: {} # permite rodar manualmente pela aba "Actions" do GitHub

jobs:
  run-search:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar migrações (idempotente)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head

      - name: Garantir seed (planos/usuário/categorias — idempotente)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOOTSTRAP_USER_EMAIL: ${{ secrets.BOOTSTRAP_USER_EMAIL }}
          BOOTSTRAP_USER_PASSWORD: ${{ secrets.BOOTSTRAP_USER_PASSWORD }}
        run: python scripts/bootstrap.py

      - name: Rodar busca do dia
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_DEFAULT_CHAT_ID: ${{ secrets.TELEGRAM_DEFAULT_CHAT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BOOTSTRAP_USER_EMAIL: ${{ secrets.BOOTSTRAP_USER_EMAIL }}
          BOOTSTRAP_USER_PASSWORD: ${{ secrets.BOOTSTRAP_USER_PASSWORD }}
        run: python worker.py --run-now
